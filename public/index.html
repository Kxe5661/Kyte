<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0b0c0f" />
<title>Kyte</title>
<style>
  :root {
    --bg: #0b0c0f;
    --elev: #12141a;
    --ink: #f4efe6;
    --muted: #a39b90;
    --faint: #6f685f;
    --line: rgba(244, 239, 230, 0.10);
    --line-strong: rgba(244, 239, 230, 0.16);
    --accent: #c6a57a;
    --accent-ink: #1a140c;
    --good: #b7c4ae;
    --bad: #c98984;
    --ease: cubic-bezier(.22, .61, .36, 1);
    --fast: 180ms;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    min-height: 100%;
    background:
      radial-gradient(900px 420px at 50% -12%, rgba(198, 165, 122, 0.07), transparent 60%),
      var(--bg);
    color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
    flex-direction: column;
    overscroll-behavior: none;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }
  @supports (height: 100dvh) {
    body { height: 100dvh; }
  }
  button, input, select { font: inherit; color: inherit; }
  ::selection { background: rgba(198, 165, 122, 0.32); }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: calc(env(safe-area-inset-top) + 16px) 20px 14px;
    background: rgba(11, 12, 15, 0.78);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .monogram {
    width: 14px; height: 14px; flex: none;
    border: 1px solid var(--accent);
    transform: rotate(45deg);
    border-radius: 2px;
  }
  .wordmark {
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: -0.035em;
    line-height: 1;
  }
  .presence {
    display: flex; align-items: center; gap: 7px;
    margin-top: 5px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.04em;
  }
  #statusDot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--faint);
    transition: background var(--fast) var(--ease);
  }
  #statusDot.thinking { background: var(--accent); animation: breathe 1.8s ease-in-out infinite; }
  #statusDot.waiting { background: var(--ink); animation: breathe 1.8s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }
  .mark {
    width: 28px; height: 28px; flex: none;
    display: block;
  }
  .sigil-stage {
    position: fixed;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -58%);
    width: min(88vw, 380px);
    height: min(48vh, 380px);
    z-index: 6;
    pointer-events: none;
    background: transparent;
    border: none;
  }
  .sigil-stage[hidden] { display: none !important; }
  .sigil-stage canvas { width: 100%; height: 100%; display: block; }
  .sigil-caption {
    position: absolute;
    left: 0; right: 0; bottom: 6%;
    text-align: center;
    color: #f4efe6;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.02em;
    text-shadow: 0 8px 24px #0b0c0f;
  }
  header .actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .chip, .textbtn {
    background: transparent;
    border: 1px solid var(--line-strong);
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: transform var(--fast) var(--ease), background var(--fast) var(--ease), color var(--fast) var(--ease), border-color var(--fast) var(--ease);
  }
  .textbtn { border-color: transparent; letter-spacing: 0.08em; padding-left: 6px; padding-right: 2px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip:active, .textbtn:active { transform: scale(0.97); }

  #live { display: none; padding: 12px 16px 0; }
  #live.open { display: block; animation: rise 200ms var(--ease); }
  #live .frame {
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    background: #090a0d;
    position: relative;
  }
  #liveImg { display: block; width: 100%; min-height: 140px; object-fit: contain; background: #090a0d; }
  #live .tag {
    position: absolute; top: 12px; left: 12px;
    color: var(--accent);
    font-size: 10px; font-weight: 600; letter-spacing: 0.16em;
    padding: 5px 9px; border-radius: 999px;
    border: 1px solid rgba(198, 165, 122, 0.4);
    background: rgba(11, 12, 15, 0.72);
  }
  #liveErr { color: var(--bad); font-size: 13px; padding: 8px 4px 0; display: none; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px 18px 8px;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    max-width: 86%;
    margin: 10px 0;
    padding: 12px 14px;
    border-radius: 18px;
    white-space: pre-wrap;
    word-break: break-word;
    animation: rise 200ms var(--ease) both;
  }
  .msg.hist, .poll.hist, .note.hist, .approval.hist { animation: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .user {
    margin-left: auto;
    background: #17140f;
    border: 1px solid rgba(198, 165, 122, 0.28);
    border-bottom-right-radius: 6px;
    color: #f7f2ea;
  }
  .assistant {
    background: transparent;
    border: 1px solid var(--line);
    border-bottom-left-radius: 6px;
  }
  .error {
    background: rgba(201, 137, 132, 0.08);
    color: #e4b6b2;
    border: 1px solid rgba(201, 137, 132, 0.28);
    font-size: 14.5px;
  }
  .msg .files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .msg .files i {
    font-style: normal;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .note {
    color: var(--faint);
    font-size: 12.5px;
    text-align: center;
    letter-spacing: 0.02em;
    padding: 8px 12px;
  }

  .approval {
    background: var(--elev);
    border: 1px solid var(--line-strong);
    border-radius: 18px;
    padding: 16px;
    margin: 12px 0;
    animation: rise 200ms var(--ease) both;
  }
  .approval h4 {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .approval pre {
    background: #0b0c0f;
    border-radius: 12px;
    border: 1px solid var(--line);
    padding: 12px;
    margin: 0 0 12px;
    font-size: 12.5px;
    line-height: 1.45;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 160px;
    overflow: auto;
    color: #ddd6cb;
  }
  .approval .btns, .poll .btns { display: flex; gap: 8px; }
  .approval button, .poll button.confirm, .poll button.ghost {
    border-radius: 12px;
    padding: 13px 12px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.01em;
    transition: transform 150ms var(--ease), opacity var(--fast);
  }
  .approval button { flex: 1; border: 1px solid var(--line-strong); background: transparent; color: var(--muted); }
  .approval button.approve { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .approval button:active, .poll button:active { transform: scale(0.975); }
  .approval.resolved .btns { display: none; }
  .verdict { margin-top: 8px; font-size: 13.5px; font-weight: 500; letter-spacing: 0.01em; }
  .verdict.yes { color: var(--good); }
  .verdict.no { color: var(--bad); }

  .poll {
    background: var(--elev);
    border: 1px solid var(--line-strong);
    border-radius: 22px;
    padding: 22px 18px 16px;
    margin: 14px 0;
    animation: rise 220ms var(--ease) both;
  }
  .poll .eyebrow {
    margin: 0 0 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .poll h3 {
    margin: 0 0 8px;
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.035em;
    line-height: 1.12;
  }
  .poll .ctx { color: var(--muted); font-size: 14.5px; line-height: 1.4; margin: 0 0 16px; }
  .progress { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; }
  .progress .track {
    flex: 1; height: 1px; background: var(--line-strong); position: relative;
  }
  .progress .track i {
    position: absolute; left: 0; top: -1px; height: 2px; width: 0;
    background: var(--accent);
    transition: width 200ms var(--ease);
    font-style: normal;
  }
  .progress .count {
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .pills { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 16px; }
  .pill {
    width: 100%;
    text-align: left;
    min-height: 56px;
    padding: 16px 16px;
    border-radius: 14px;
    background: transparent;
    border: 1px solid var(--line-strong);
    color: var(--ink);
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.015em;
    transition: transform 150ms var(--ease), border-color var(--fast) var(--ease), background var(--fast) var(--ease);
  }
  .pill:active { transform: scale(0.985); background: rgba(198, 165, 122, 0.06); }
  .pill.on {
    border-color: rgba(198, 165, 122, 0.85);
    background: rgba(198, 165, 122, 0.10);
  }
  .poll button.confirm {
    flex: 1;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
  }
  .poll button.confirm:disabled { opacity: 0.38; }
  .poll button.ghost {
    flex: 0 0 auto;
    min-width: 88px;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line-strong);
  }
  .poll.resolved .pills,
  .poll.resolved .btns,
  .poll.resolved .wizard,
  .poll.resolved .progress { display: none; }
  .wizard { overflow: hidden; touch-action: pan-y; }
  .wizard .pane { min-height: 92px; }
  .wizard label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .wizard input, .wizard select {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line-strong);
    border-radius: 0;
    padding: 12px 2px 14px;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.03em;
    outline: none;
    transition: border-color var(--fast) var(--ease);
  }
  .wizard input:focus, .wizard select:focus { border-bottom-color: var(--accent); }
  .wizard input::placeholder { color: var(--faint); font-weight: 400; }
  .switch {
    width: 58px; height: 34px; border-radius: 999px;
    background: #2a2824; border: 1px solid var(--line-strong);
    position: relative; transition: background var(--fast) var(--ease);
  }
  .switch.on { background: var(--accent); border-color: var(--accent); }
  .switch::after {
    content: '';
    position: absolute; top: 3px; left: 3px;
    width: 26px; height: 26px; border-radius: 50%;
    background: #f4efe6;
    transition: transform 200ms var(--ease);
  }
  .switch.on::after { transform: translateX(24px); background: var(--accent-ink); }

  #vaultSheet { position: fixed; inset: 0; z-index: 8; display: none; }
  #vaultSheet.open { display: block; }
  #vaultSheet .backdrop { position: absolute; inset: 0; background: rgba(6, 6, 8, 0.62); }
  #vaultSheet .card {
    position: absolute; left: 0; right: 0; bottom: 0;
    max-height: min(88vh, 760px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: #101116;
    border-top: 1px solid var(--line-strong);
    border-radius: 22px 22px 0 0;
    padding: 10px 20px calc(env(safe-area-inset-bottom) + 22px);
    animation: sheet 220ms var(--ease);
  }
  @keyframes sheet { from { transform: translateY(16px); opacity: 0; } }
  #vaultSheet .handle {
    width: 36px; height: 2px; border-radius: 999px;
    background: rgba(244, 239, 230, 0.28);
    margin: 6px auto 16px;
  }
  #vaultSheet h2 {
    margin: 0;
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 28px; font-weight: 500; letter-spacing: -0.035em;
  }
  #vaultSheet .sub, .acct .who, .acct .mask { color: var(--muted); font-size: 13.5px; margin: 6px 0 16px; }
  .tabs { display: flex; gap: 18px; margin: 0 0 18px; border-bottom: 1px solid var(--line); }
  .tabs button {
    background: none; border: none; border-bottom: 1px solid transparent;
    color: var(--faint); font-size: 13px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 8px 0 10px; margin-bottom: -1px;
  }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
  .field { margin: 0 0 14px; }
  .field span {
    display: block; font-size: 11px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line-strong);
    border-radius: 0;
    padding: 10px 2px 12px;
    font-size: 16px;
    outline: none;
  }
  .field input:focus { border-bottom-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .savebtn {
    width: 100%; margin-top: 8px; padding: 15px;
    border: none; border-radius: 14px;
    background: var(--accent); color: var(--accent-ink);
    font-size: 16px; font-weight: 600; letter-spacing: -0.01em;
    transition: transform 150ms var(--ease);
  }
  .savebtn:active { transform: scale(0.985); }
  #vaultAccounts h3 {
    margin: 18px 0 12px;
    font-size: 13px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
  }
  .acct {
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
    margin: 0 0 10px;
  }
  .acct .top { display: flex; align-items: center; gap: 8px; }
  .acct b { flex: 1; font-weight: 500; }
  .acct .who, .acct .mask { margin: 4px 0 0; }
  .acct .mask { letter-spacing: 0.18em; color: var(--faint); }
  .tiny { background: none; border: none; color: var(--accent); font-weight: 600; font-size: 13px; }
  .tiny.danger { color: var(--bad); }
  #vaultToast { text-align: center; color: var(--good); font-size: 13px; min-height: 18px; margin: 10px 0 0; }

  footer {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px 16px calc(env(safe-area-inset-bottom) + 12px);
    background: rgba(11, 12, 15, 0.9);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
  }
  .now {
    display: flex; align-items: center; gap: 8px;
    min-height: 18px;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.01em;
    padding: 2px 4px 0;
  }
  .now[hidden], .people[hidden] { display: none !important; }
  .now::before {
    content: '';
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: breathe 1.6s ease-in-out infinite;
    flex: none;
  }
  .people {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 2px 0;
    scrollbar-width: none;
  }
  .people::-webkit-scrollbar, .quick::-webkit-scrollbar { display: none; }
  .person {
    display: inline-flex; align-items: center; gap: 2px;
    flex: 0 0 auto;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    padding: 2px 2px 2px 12px;
    background: rgba(244, 239, 230, 0.03);
  }
  .person.pinned { border-color: rgba(198, 165, 122, 0.55); }
  .person .who, .person .star {
    background: none; border: none; padding: 6px 4px;
  }
  .person .who { font-size: 13.5px; font-weight: 500; letter-spacing: -0.01em; }
  .person .star { color: var(--faint); font-size: 13px; padding-right: 8px; }
  .person.pinned .star { color: var(--accent); }
  .person .who:active, .person .star:active { transform: scale(0.96); }
  .quick {
    display: flex; gap: 8px; overflow-x: auto;
    padding-bottom: 2px;
  }
  .quickbtn {
    flex: 0 0 auto;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: rgba(244, 239, 230, 0.03);
    color: var(--ink);
    padding: 8px 14px;
    font-size: 13.5px;
    font-weight: 500;
    letter-spacing: -0.01em;
    transition: transform 150ms var(--ease), background var(--fast) var(--ease), border-color var(--fast) var(--ease);
  }
  .quickbtn:active { transform: scale(0.97); background: rgba(198, 165, 122, 0.12); border-color: rgba(198, 165, 122, 0.45); }
  .attach-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .attach-row:empty { display: none; }
  .attach-chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); color: var(--ink);
    border-radius: 999px; padding: 4px 10px; font-size: 12px; max-width: 220px;
  }
  .attach-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attach-chip button { background: none; border: none; color: var(--muted); font-size: 14px; padding: 0; }
  .composer {
    display: flex; align-items: center; gap: 4px;
    background: #14161c;
    border: 1px solid var(--line-strong);
    border-radius: 28px;
    padding: 4px 4px 4px 6px;
    transition: border-color var(--fast) var(--ease);
  }
  .composer:focus-within { border-color: rgba(198, 165, 122, 0.55); }
  .iconbtn {
    width: 36px; height: 36px; border-radius: 50%; flex: none;
    background: transparent; border: none; color: var(--muted);
    font-size: 22px; line-height: 1;
    display: grid; place-items: center;
  }
  .iconbtn:active { transform: scale(0.94); }
  #input {
    flex: 1; min-width: 0;
    background: transparent; border: none;
    padding: 10px 6px;
    font-size: 16px;
    outline: none;
  }
  #input::placeholder { color: var(--faint); }
  #send {
    width: 40px; height: 40px; flex: none;
    border: none; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink);
    font-size: 18px;
    display: grid; place-items: center;
    transition: transform 150ms var(--ease), opacity var(--fast);
  }
  #send:active { transform: scale(0.94); }
  #send:disabled { opacity: 0.35; }

  #login {
    position: fixed; inset: 0; z-index: 10;
    background:
      radial-gradient(700px 360px at 50% 18%, rgba(198, 165, 122, 0.08), transparent 62%),
      var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 32px 28px; text-align: center;
  }
  #login .monogram { width: 18px; height: 18px; margin-bottom: 8px; }
  #login h1 {
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 40px; font-weight: 500; letter-spacing: -0.04em;
    margin: 0;
  }
  #login p { color: var(--muted); margin: 0; font-size: 15px; line-height: 1.5; max-width: 280px; }
  #password {
    margin-top: 10px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line-strong);
    color: var(--ink);
    padding: 12px 8px;
    font-size: 18px;
    text-align: center;
    width: min(280px, 100%);
    outline: none;
    letter-spacing: 0.08em;
  }
  #password:focus { border-bottom-color: var(--accent); }
  #login button {
    margin-top: 8px;
    background: var(--accent); color: var(--accent-ink);
    border: none; border-radius: 999px;
    padding: 14px 36px; font-size: 15px; font-weight: 600;
    letter-spacing: 0.02em;
    transition: transform 150ms var(--ease);
  }
  #login button:active { transform: scale(0.97); }
  #loginErr { color: var(--bad); font-size: 14px; min-height: 18px; }
  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
  @media (max-width: 390px) {
    header { gap: 8px; padding-left: 14px; padding-right: 14px; }
    .chip { padding: 6px 8px; letter-spacing: 0.06em; }
    .wordmark { font-size: 20px; }
    .poll h3 { font-size: 26px; }
  }
  @media (min-width: 760px) {
    #chat, #live, footer { max-width: 720px; margin-left: auto; margin-right: auto; width: 100%; }
    header { max-width: 760px; margin-left: auto; margin-right: auto; width: 100%; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  }
</style>
</head>
<body>
  <div id="login" class="hidden">
    <span class="monogram" aria-hidden="true"></span>
    <h1>Kyte</h1>
    <p>Private access to your Mac. The password is in the Kyte terminal.</p>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <button type="button" onclick="tryLogin()">Continue</button>
    <p id="loginErr"></p>
  </div>

  <header>
    <div class="brand">
      <canvas class="mark" id="mark" width="56" height="56" aria-hidden="true"></canvas>
      <div>
        <div class="wordmark">Kyte</div>
        <div class="presence"><span id="statusDot"></span><span id="statusWord">Ready</span></div>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="chip" id="liveBtn" onclick="toggleLive()">Live</button>
      <button type="button" class="chip" id="vaultBtn" onclick="toggleVault()">Autofill</button>
      <button type="button" class="textbtn" onclick="resetChat()">New</button>
    </div>
  </header>

  <div id="live">
    <div class="frame">
      <span class="tag">LIVE</span>
      <img id="liveImg" alt="Live view of your Mac screen" />
    </div>

  </div>

  <div id="vaultSheet">
    <div class="backdrop" onclick="toggleVault(false)"></div>
    <div class="card">
      <div class="handle"></div>
      <h2>Autofill</h2>
      <p class="sub">Kept on this Mac. Passwords stay out of the conversation.</p>
      <div class="tabs">
        <button type="button" id="tabProfile" class="on" onclick="vaultTab('profile')">Profile</button>
        <button type="button" id="tabAccounts" onclick="vaultTab('accounts')">Accounts</button>
      </div>
      <div id="vaultProfile">
        <label class="field"><span>Name</span><input id="vp_name" autocomplete="name" /></label>
        <label class="field"><span>Email</span><input id="vp_email" type="email" autocomplete="email" /></label>
        <label class="field"><span>Phone</span><input id="vp_phone" type="tel" autocomplete="tel" /></label>
        <label class="field"><span>Address</span><input id="vp_address" autocomplete="street-address" /></label>
        <div class="row2">
          <label class="field"><span>City</span><input id="vp_city" autocomplete="address-level2" /></label>
          <label class="field"><span>State</span><input id="vp_state" autocomplete="address-level1" /></label>
        </div>
        <div class="row2">
          <label class="field"><span>ZIP</span><input id="vp_zip" autocomplete="postal-code" /></label>
          <label class="field"><span>Country</span><input id="vp_country" autocomplete="country-name" /></label>
        </div>
        <button type="button" class="savebtn" onclick="saveProfile()">Save profile</button>

      <div id="vaultAccounts" class="hidden">
        <div id="acctList"></div>

        <label class="field"><span>Username</span><input id="va_user" autocomplete="username" /></label>
        <label class="field"><span>Password</span><input id="va_secret" type="password" autocomplete="new-password" placeholder="Stored on this Mac" /></label>
        <button type="button" class="savebtn" onclick="saveAccount()">Save account</button>

      <div id="vaultToast"></div>

  <div id="sigilStage" class="sigil-stage" hidden>
    <canvas id="sigil" width="640" height="640" aria-hidden="true"></canvas>
    <div id="sigilCaption" class="sigil-caption"></div>
  </div>

  <div id="chat"></div>

  <footer>
    <div id="now" class="now" hidden aria-live="polite"></div>
    <div id="people" class="people" hidden></div>
    <div class="quick" id="quick">
      <button type="button" class="quickbtn" onclick="quick('call')">Call</button>
      <button type="button" class="quickbtn" onclick="quick('text')">Text</button>
      <button type="button" class="quickbtn" onclick="quick('research')">Research</button>
      <button type="button" class="quickbtn" onclick="quick('form')">Fill a form</button>
    </div>
    <div class="attach-row" id="attachRow"></div>
    <div class="composer">
      <button type="button" class="iconbtn" id="attachBtn" onclick="document.getElementById('filePick').click()" aria-label="Attach files">+</button>
      <input id="filePick" type="file" multiple hidden />
      <input id="folderPick" type="file" webkitdirectory multiple hidden />
      <input id="input" placeholder="Message Kyte" autocomplete="off" enterkeyhint="send" />
      <button type="button" id="send" onclick="send()" aria-label="Send">↑</button>
    </div>
  </footer>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const statusDot = document.getElementById('statusDot');
  const statusWord = document.getElementById('statusWord');
  let auth = localStorage.getItem('kyte_auth') || '';
  let es = null;
  let liveTimer = null;
  let pendingFiles = [];
  let replaying = false;
  let localPending = null;
  let reconnectTimer = null;
  let contactNames = [];
  let scrollQueued = false;

  const QUICK = {
    call: 'Call someone',
    text: 'Text someone',
    research: 'Research something for me',
    form: 'Fill a form for me',
  };

  function api(path, opts = {}) {
    const timeout = opts.timeout || 20000;
    const headers = opts.headers || {};
    const rest = { ...opts };
    delete rest.timeout;
    delete rest.headers;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    return fetch(path, {
      ...rest,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + auth, ...headers },
      signal: ctrl.signal,
    }).finally(() => clearTimeout(timer));
  }

  async function tryLogin() {
    auth = document.getElementById('password').value.trim();
    const probe = await api('/api/approve', { method: 'POST', body: '{}' }).catch(() => null);
    if (!probe || probe.status === 401) {
      document.getElementById('loginErr').textContent = 'That password doesn’t match the terminal.';
      return;
    }
    localStorage.setItem('kyte_auth', auth);
    document.getElementById('login').classList.add('hidden');
    connect();
  }

  function showLogin() {
    const login = document.getElementById('login');
    if (login) login.classList.remove('hidden');
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  function asText(v, cap) {
    let s = '';
    if (typeof v === 'string') s = v;
    else if (v == null) s = '';
    else {
      try { s = JSON.stringify(v); } catch { s = ''; }
    }
    if (s.length > cap) return s.slice(0, cap) + '…';
    return s;
  }

  function scroll() {
    if (!chat || scrollQueued) return;
    scrollQueued = true;
    const tick = () => {
      scrollQueued = false;
      try { chat.scrollTop = chat.scrollHeight; } catch { /* ignore */ }
    };
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
    else setTimeout(tick, 16);
  }

  function isFresh(ev) {
    if (replaying) return false;
    if (!ev || !ev.ts) return true;
    return Date.now() - ev.ts < 12000;
  }

  function fmtArgs(args) {
    try {
      if (!args || typeof args !== 'object') return '';
      const clip = (s) => asText(s, 500);
      if (args.command) return clip(args.command);
      if (args.script) return clip(args.script);
      if (args.javascript) return clip(args.javascript);
      if (args.fact) return clip(args.fact);
      if (args.title) return clip(args.title + (args.context ? ' — ' + args.context : ''));
      if (args.goal) return clip(args.goal);
      if (args.target) return clip(args.target);
      if (args.query && args.url) return clip(args.url + ' — ' + args.query);
      if (args.query) return clip(args.query);
      if (args.url) return clip(args.url);
      if (args.to && args.body) return clip(args.to + ' — ' + args.body);
      if (args.to) return clip(args.to);
      const copy = {};
      for (const k of Object.keys(args).slice(0, 12)) {
        if (/image|secret|password|token|base64/i.test(k)) continue;
        const v = args[k];
        copy[k] = typeof v === 'string' ? asText(v, 240) : v;
      }
      return asText(JSON.stringify(copy, null, 2), 700);
    } catch {
      return '';
    }
  }

  const FRIENDLY = {
    run_shell: 'running a command', run_applescript: 'controlling an app',
    open_app: 'opening an app', open_url: 'opening a page',
    read_file: 'reading a file', write_file: 'writing a file',
    list_dir: 'looking in a folder', save_memory: 'remembering',
    fetch_url: 'reading a site', find_contact: 'finding a contact',
    send_imessage: 'sending a message', facetime_call: 'starting a call',
    save_contact: 'saving a contact', approve_system_dialog: 'clicking Allow',
    see_screen: 'looking at the screen', use_computer: 'using the screen',
    safari_open: 'opening Safari', browse_safari: 'opening Safari',
    safari_eval: 'reading the page', safari_fill: 'filling a form',
    safari_click: 'clicking in Safari', safari_read: 'reading Safari',
    safari_tabs: 'checking Safari tabs', web_task: 'working in Safari',
    schedule_task: 'scheduling',
    list_schedule: 'checking the schedule', cancel_task: 'cancelling a job',
    ask_user: 'waiting on you', vault_get: 'checking autofill',
    vault_set: 'saving autofill',
  };

  function sentence(s) {
    const t = String(s || '').trim();
    if (!t) return 'Working';
    return t.charAt(0).toUpperCase() + t.slice(1);
  }

  function setNow(text) {
    const n = document.getElementById('now');
    const t = String(text || '').replace(/\s+/g, ' ').trim().slice(0, 72);
    if (n) {
      n.textContent = t;
      n.hidden = !t;
    }
    const cap = document.getElementById('sigilCaption');
    if (cap) cap.textContent = t;
  }

  function setPresence(state) {
    const thinking = state === 'thinking';
    const waiting = state === 'waiting';
    if (statusDot) statusDot.className = thinking ? 'thinking' : waiting ? 'waiting' : '';
    if (statusWord) statusWord.textContent = thinking ? 'Working' : waiting ? 'Waiting' : 'Ready';
    if (sendBtn) sendBtn.disabled = thinking || waiting;
    if (!thinking && !waiting) setSigil('idle');
    else if (waiting) setSigil('wait');
    else if (sigilMood === 'idle') setSigil('think');
  }

  const SIGIL = {
    idle:  { speed: 0.22, sharp: 0.15, pulse: 0.18, rings: 0 },
    think: { speed: 0.62, sharp: 0.28, pulse: 0.55, rings: 0 },
    read:  { speed: 0.38, sharp: 0.02, pulse: 0.42, rings: 0.15 },
    act:   { speed: 1.05, sharp: 1, pulse: 0.34, rings: 0 },
    call:  { speed: 0.74, sharp: 0.42, pulse: 0.9, rings: 1 },
    wait:  { speed: 0.18, sharp: 0.08, pulse: 0.7, rings: 0.45 },
  };
  let sigilMood = 'idle';
  let sigilLive = Object.assign({}, SIGIL.idle);
  let sigilTarget = Object.assign({}, SIGIL.idle);
  let sigilTime = 0;
  let sigilRaf = 0;
  const sigilReduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function moodForTool(name) {
    const n = String(name || '');
    if (n === 'ask_user' || n === 'approve_system_dialog') return 'wait';
    if (n === 'facetime_call' || n === 'send_imessage' || n === 'find_contact') return 'call';
    if (/safari_click|safari_fill|use_computer|web_task|run_applescript|open_app/.test(n)) return 'act';
    if (/safari_read|safari_eval|safari_open|fetch_url|see_screen/.test(n)) return 'read';
    if (/memory|vault|schedule/.test(n)) return 'think';
    return 'think';
  }

  function placeSigil() {
    const stage = document.getElementById('sigilStage');
    if (!stage || stage.hidden) return;
    const vv = window.visualViewport;
    const top = vv ? vv.offsetTop : 0;
    const h = vv ? vv.height : window.innerHeight;
    const y = sigilMood === 'wait' ? top + Math.min(150, h * 0.22) : top + h * 0.4;
    stage.style.top = y + 'px';
  }

  function setSigil(next) {
    if (!SIGIL[next]) next = 'think';
    sigilMood = next;
    sigilTarget = SIGIL[next];
    const stage = document.getElementById('sigilStage');
    if (stage) stage.hidden = next === 'idle';
    placeSigil();
    if (!sigilRaf) sigilRaf = requestAnimationFrame(drawSigil);
  }

  function lerpSigil(a, b, t) { return a + (b - a) * t; }

  function fitCanvas(canvas) {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(2, Math.round(rect.width * dpr));
    const h = Math.max(2, Math.round(rect.height * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
  }

  function formScale(theta, sharp) {
    const sector = (Math.PI * 2) / 3;
    const a = ((theta % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const local = (a % sector) - sector / 2;
    const tri = Math.cos(Math.PI / 3) / Math.max(0.22, Math.cos(local));
    return (1 - sharp) + tri * sharp;
  }

  function traceForm(ctx, cx, cy, R, rot, sharp, squash) {
    const steps = 90;
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const t = (i / steps) * Math.PI * 2;
      const k = formScale(t, sharp);
      const ang = t + rot;
      const x = cx + Math.cos(ang) * R * k;
      const y = cy + Math.sin(ang) * R * k * squash;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function paintSigil(canvas, big) {
    if (!canvas) return;
    fitCanvas(canvas);
    const ctx = canvas.getContext('2d');
    if (!ctx) return;
    const w = canvas.width;
    const h = canvas.height;
    const cx = w / 2;
    const cy = h / 2;
    const s = sigilLive;
    ctx.clearRect(0, 0, w, h);
    const breathe = 1 + Math.sin(sigilTime * (0.9 + s.pulse * 1.4)) * (big ? 0.045 : 0.03) * (0.4 + s.pulse);
    const radius = Math.min(w, h) * (big ? 0.34 : 0.36) * breathe;
    const squash = big ? 0.92 : 1;
    const rot = sigilTime * s.speed * (big ? 0.55 : 0.35);

    const bloom = ctx.createRadialGradient(cx, cy, radius * 0.05, cx, cy, radius * 1.85);
    bloom.addColorStop(0, 'rgba(244,239,230,' + (0.16 + s.pulse * 0.18) + ')');
    bloom.addColorStop(0.35, 'rgba(198,165,122,' + (0.22 + s.pulse * 0.2) + ')');
    bloom.addColorStop(1, 'rgba(198,165,122,0)');
    ctx.fillStyle = bloom;
    ctx.beginPath();
    ctx.ellipse(cx, cy, radius * 1.7, radius * 1.35, 0, 0, Math.PI * 2);
    ctx.fill();

    if (big && s.rings > 0.04) {
      for (let i = 0; i < 3; i++) {
        const phase = (sigilTime * (0.22 + s.pulse * 0.25) + i * 0.33) % 1;
        ctx.beginPath();
        ctx.ellipse(cx, cy, radius * (0.55 + phase * 1.35), radius * (0.55 + phase * 1.35) * squash, 0, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(198,165,122,' + ((1 - phase) * 0.42 * s.rings) + ')';
        ctx.lineWidth = Math.max(1, h * 0.004);
        ctx.stroke();
      }
    }

    ctx.save();
    ctx.globalAlpha = 0.35 + (1 - s.sharp) * 0.25;
    traceForm(ctx, cx, cy, radius * 1.08, -rot * 0.72, Math.max(0, s.sharp * 0.85), squash);
    ctx.strokeStyle = 'rgba(198,165,122,0.55)';
    ctx.lineWidth = Math.max(1, h * (big ? 0.006 : 0.03));
    ctx.stroke();
    ctx.restore();

    traceForm(ctx, cx, cy, radius, rot, s.sharp, squash);
    const fill = ctx.createRadialGradient(cx, cy - radius * 0.15, radius * 0.05, cx, cy, radius);
    fill.addColorStop(0, 'rgba(244,239,230,' + (0.22 + (1 - s.sharp) * 0.2) + ')');
    fill.addColorStop(0.55, 'rgba(198,165,122,' + (0.16 + s.pulse * 0.12) + ')');
    fill.addColorStop(1, 'rgba(198,165,122,0.02)');
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = 'rgba(244,239,230,' + (0.72 + s.sharp * 0.25) + ')';
    ctx.lineWidth = Math.max(1.25, h * (big ? 0.008 : 0.045));
    ctx.lineJoin = 'round';
    ctx.stroke();

    if (big) {
      const count = 14;
      for (let i = 0; i < count; i++) {
        const orbit = sigilTime * (0.25 + s.speed * 0.35) * (i % 2 ? 1 : -1) + i * 0.9;
        const rr = radius * (1.15 + (i % 4) * 0.09);
        const x = cx + Math.cos(orbit) * rr;
        const y = cy + Math.sin(orbit) * rr * 0.62;
        const alpha = 0.15 + (i % 5) * 0.08;
        ctx.beginPath();
        ctx.arc(x, y, Math.max(0.8, h * 0.006), 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(244,239,230,' + alpha + ')';
        ctx.fill();
      }
      for (let i = 0; i < 3; i++) {
        const ang = rot + i * (Math.PI * 2 / 3);
        const k = formScale(i * (Math.PI * 2 / 3), s.sharp);
        const x = cx + Math.cos(ang) * radius * k;
        const y = cy + Math.sin(ang) * radius * k * squash;
        const spark = ctx.createRadialGradient(x, y, 0, x, y, radius * 0.22);
        spark.addColorStop(0, 'rgba(244,239,230,0.95)');
        spark.addColorStop(1, 'rgba(198,165,122,0)');
        ctx.fillStyle = spark;
        ctx.beginPath();
        ctx.arc(x, y, radius * 0.22, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    const core = Math.max(1.5, h * (big ? 0.012 : 0.06));
    const coreGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, core * 4);
    coreGlow.addColorStop(0, 'rgba(244,239,230,0.95)');
    coreGlow.addColorStop(1, 'rgba(244,239,230,0)');
    ctx.fillStyle = coreGlow;
    ctx.beginPath();
    ctx.arc(cx, cy, core * 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy, core, 0, Math.PI * 2);
    ctx.fillStyle = '#f4efe6';
    ctx.fill();
  }

  function drawSigil() {
    const step = sigilReduce ? 1 : 0.08;
    sigilLive.speed = lerpSigil(sigilLive.speed, sigilTarget.speed, step);
    sigilLive.sharp = lerpSigil(sigilLive.sharp, sigilTarget.sharp, step);
    sigilLive.pulse = lerpSigil(sigilLive.pulse, sigilTarget.pulse, step);
    sigilLive.rings = lerpSigil(sigilLive.rings, sigilTarget.rings, step);
    if (!sigilReduce) sigilTime += 0.016;
    paintSigil(document.getElementById('mark'), false);
    paintSigil(document.getElementById('sigil'), true);
    placeSigil();
    sigilRaf = requestAnimationFrame(drawSigil);
  }
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', placeSigil);
    visualViewport.addEventListener('scroll', placeSigil);
  }
  setSigil('idle');

  function cardById(className, id) {
    if (!chat || !id) return null;
    const want = String(id);
    let nodes;
    try { nodes = chat.querySelectorAll('.' + className); }
    catch { return null; }
    for (const n of nodes) {
      if (n.dataset && n.dataset.id === want) return n;
    }
    return null;
  }

  function setVerdict(card, yes, text) {
    if (!card) return;
    try { card.classList.add('resolved'); } catch { /* ignore */ }
    const v = card.querySelector ? card.querySelector('.verdict') : null;
    if (!v) return;
    v.textContent = text;
    v.classList.add(yes ? 'yes' : 'no');
  }

  function formatAnswers(answers) {
    try {
      if (!answers || typeof answers !== 'object') return 'Got it';
      if (answers.labels && answers.labels.length) return asText(answers.labels.join(', '), 180);
      if (answers.choice) return asText(answers.choice, 180);
      if (answers.selected && answers.selected.length) return asText(answers.selected.join(', '), 180);
      const bits = Object.entries(answers)
        .filter(([k, v]) => v !== '' && v != null && !['selected', 'choice', 'labels'].includes(k))
        .map(([k, v]) => k + ': ' + (typeof v === 'string' ? v : asText(v, 40)));
      return bits.length ? asText(bits.join(' · '), 180) : 'Got it';
    } catch {
      return 'Got it';
    }
  }

  function optionId(o) {
    if (o == null) return '';
    if (typeof o !== 'object') return String(o);
    return String(o.id || o.label || '');
  }
  function optionLabel(o) {
    if (o == null) return '';
    if (typeof o !== 'object') return String(o);
    return String(o.label || o.id || '');
  }

  function render(ev) {
    try {
      if (!ev || typeof ev !== 'object') return;
      paint(ev);
    } catch {
      /* one bad event must not take the page down */
    }
    scroll();
  }

  function paint(ev) {
    if (!chat || !ev) return;
    const hist = isFresh(ev) ? '' : ' hist';
    if (ev.type === 'user') {
      const text = asText(ev.text, 6000) || '(attachment)';
      const names = Array.isArray(ev.attachments) ? ev.attachments : [];
      if (localPending && localPending.text === text) {
        const pending = chat.querySelector('.msg.user[data-pending="1"]');
        if (pending && pending.dataset.text === text) {
          pending.removeAttribute('data-pending');
          localPending = null;
          return;
        }
        localPending = null;
      }
      appendUserBubble(text, names, hist, false);
    } else if (ev.type === 'assistant') {
      if (/^\s*(Called [\w.-]+ with\b|Result of [\w.-]+:|\[internal\])/i.test(String(ev.text || ''))) return;
      chat.appendChild(el('div', 'msg assistant' + hist, asText(ev.text, 6000)));
    } else if (ev.type === 'error') {
      chat.appendChild(el('div', 'msg error' + hist, asText(ev.text, 600)));
      setNow('');
    } else if (ev.type === 'status') {
      const keepLocal = localPending && replaying && ev.state !== 'thinking' && ev.state !== 'waiting';
      if (!keepLocal) setPresence(ev.state);
      if (ev.state === 'thinking') {
        const note = asText(ev.note, 72);
        const nowEl = document.getElementById('now');
        if (note) setNow(note);
        else if (!nowEl || nowEl.hidden) setNow('Working');
      } else if (ev.state === 'waiting') {
        setNow(asText(ev.note, 72) || 'Waiting for you');
      } else if (!keepLocal) {
        setNow('');
        if (ev.note && isFresh(ev)) chat.appendChild(el('div', 'note' + hist, asText(ev.note, 160)));
      }
    } else if (ev.type === 'gate') {
      if (ev.verdict === 'deny') chat.appendChild(el('div', 'msg error' + hist, asText(ev.reason || 'Blocked', 300)));
    } else if (ev.type === 'computer') {
      setSigil('act');
      setNow(asText(ev.summary || 'Using the screen', 72));
    } else if (ev.type === 'schedule_run') {
      chat.appendChild(el('div', 'note' + hist, 'Scheduled · ' + asText(ev.label || ev.id, 80)));
    } else if (ev.type === 'learned') {
      chat.appendChild(el('div', 'note' + hist, 'Noted · ' + asText(ev.summary || 'filed that away', 120)));
    } else if (ev.type === 'tool_start') {
      setSigil(moodForTool(ev.name));
      setNow(sentence(FRIENDLY[ev.name] || asText(ev.name, 40)));
      notePersonFromTool(ev);
    } else if (ev.type === 'approval_request') {
      const card = el('div', 'approval' + hist);
      if (ev.id) card.dataset.id = String(ev.id);
      card.appendChild(el('h4', '', 'Approval · ' + asText(ev.class || FRIENDLY[ev.name] || ev.name, 60)));
      if (ev.reason) card.appendChild(el('div', 'note', asText(ev.reason, 200)));
      card.appendChild(el('pre', '', fmtArgs(ev.args)));
      const btns = el('div', 'btns');
      const no = el('button', 'deny', 'Deny');
      const ok = el('button', 'approve', 'Allow once');
      const always = el('button', 'approve', 'Always');
      no.type = ok.type = always.type = 'button';
      ok.onclick = () => decide(ev.id, true, false);
      always.onclick = () => decide(ev.id, true, true);
      no.onclick = () => decide(ev.id, false, false);
      btns.append(no, ok, always);
      card.appendChild(btns);
      card.appendChild(el('div', 'verdict'));
      chat.appendChild(card);
      if (isFresh(ev)) { setSigil('wait'); setNow('Waiting for approval'); }
    } else if (ev.type === 'approval_resolved') {
      const card = cardById('approval', ev.id);
      if (card) card.style.borderColor = ev.approved ? 'rgba(183,196,174,0.7)' : 'rgba(244,239,230,0.12)';
      setVerdict(card, ev.approved, ev.approved ? 'Approved' : ('Denied' + (ev.reason === 'timeout' ? ' · timed out' : '')));
    } else if (ev.type === 'poll') { setSigil('wait'); renderChoice(ev); }
    else if (ev.type === 'form') { setSigil('wait'); renderForm(ev); }
    else if (ev.type === 'poll_resolved' || ev.type === 'form_resolved') {
      const card = cardById('poll', ev.id);
      if (card) card.style.borderColor = ev.submitted ? 'rgba(183,196,174,0.7)' : 'rgba(244,239,230,0.12)';
      if (ev.submitted) { setSigil('think'); setVerdict(card, true, formatAnswers(ev.answers)); }
      else setVerdict(card, false, 'Timed out');
    }
  }

  function renderChoice(ev) {
    const options = Array.isArray(ev.options) ? ev.options : [];
    const card = el('div', 'poll' + (isFresh(ev) ? '' : ' hist'));
    if (ev.id) card.dataset.id = String(ev.id);
    card.appendChild(el('div', 'eyebrow', ev.multi ? 'Choose any' : 'A decision'));
    card.appendChild(el('h3', '', asText(ev.title || 'What should I do?', 160)));
    if (ev.context) card.appendChild(el('div', 'ctx', asText(ev.context, 280)));
    const pills = el('div', 'pills');
    const selected = new Set();
    options.forEach((opt) => {
      const id = optionId(opt);
      const btn = el('button', 'pill', optionLabel(opt) || id || 'Option');
      btn.type = 'button';
      btn.dataset.oid = id;
      btn.onclick = () => {
        if (ev.multi) {
          if (selected.has(id)) selected.delete(id);
          else selected.add(id);
        } else {
          selected.clear();
          selected.add(id);
        }
        pills.querySelectorAll('.pill').forEach((p) => p.classList.toggle('on', selected.has(p.dataset.oid)));
        go.disabled = !selected.size;
      };
      pills.appendChild(btn);
    });
    card.appendChild(pills);
    const btns = el('div', 'btns');
    const go = el('button', 'confirm', 'Confirm');
    go.type = 'button';
    go.disabled = true;
    go.onclick = () => {
      if (!selected.size) return;
      const labels = options.filter((o) => selected.has(optionId(o))).map((o) => optionLabel(o) || optionId(o));
      submitPoll(ev.id, { selected: [...selected], choice: [...selected][0], labels });
    };
    btns.appendChild(go);
    card.appendChild(btns);
    card.appendChild(el('div', 'verdict'));
    chat.appendChild(card);
  }

  function renderForm(ev) {
    const raw = Array.isArray(ev.fields) ? ev.fields : [];
    const fields = raw.map((f, i) => {
      if (typeof f === 'string') return { id: 'f' + i, label: f, type: 'text' };
      if (!f || typeof f !== 'object') return null;
      return f;
    }).filter(Boolean);
    if (!fields.length) return;
    const values = {};
    fields.forEach((f, i) => {
      if (!f.id) f.id = 'f' + i;
      values[f.id] = f.value == null ? '' : f.value;
    });
    let idx = 0;
    const card = el('div', 'poll' + (isFresh(ev) ? '' : ' hist'));
    if (ev.id) card.dataset.id = String(ev.id);
    card.appendChild(el('div', 'eyebrow', 'Details'));
    card.appendChild(el('h3', '', asText(ev.title || 'A few details', 160)));
    if (ev.context) card.appendChild(el('div', 'ctx', asText(ev.context, 280)));
    const progress = el('div', 'progress');
    const track = el('div', 'track');
    const bar = el('i', '');
    track.appendChild(bar);
    const count = el('div', 'count', '');
    progress.append(track, count);
    card.appendChild(progress);
    const wizard = el('div', 'wizard');
    const pane = el('div', 'pane');
    wizard.appendChild(pane);
    card.appendChild(wizard);
    const btns = el('div', 'btns');
    const back = el('button', 'ghost', 'Back');
    const next = el('button', 'confirm', fields.length < 2 ? 'Submit' : 'Next');
    back.type = next.type = 'button';
    btns.append(back, next);
    card.appendChild(btns);
    card.appendChild(el('div', 'verdict'));

    function paintProgress() {
      const pct = fields.length ? ((idx + 1) / fields.length) * 100 : 0;
      bar.style.width = pct + '%';
      count.textContent = (idx + 1) + '  /  ' + fields.length;
    }

    function fieldControl(f) {
      if (f.type === 'toggle') {
        const sw = el('button', values[f.id] ? 'switch on' : 'switch');
        sw.type = 'button';
        sw.setAttribute('aria-label', asText(f.label || f.id, 40));
        sw.onclick = () => {
          values[f.id] = !values[f.id];
          sw.classList.toggle('on', Boolean(values[f.id]));
        };
        return sw;
      }
      if (f.type === 'select') {
        const sel = document.createElement('select');
        const options = Array.isArray(f.options) ? f.options : [];
        options.forEach((o) => {
          if (o == null) return;
          const opt = document.createElement('option');
          opt.value = optionId(o);
          opt.textContent = optionLabel(o) || opt.value;
          if (String(values[f.id]) === String(opt.value)) opt.selected = true;
          sel.appendChild(opt);
        });
        if (!values[f.id] && sel.options[0]) values[f.id] = sel.options[0].value;
        sel.onchange = () => { values[f.id] = sel.value; };
        return sel;
      }
      const inputEl = document.createElement('input');
      const kind = f.type === 'tel' || f.type === 'email' || f.type === 'number' ? f.type : 'text';
      inputEl.type = kind;
      inputEl.value = values[f.id] == null ? '' : String(values[f.id]);
      inputEl.placeholder = f.placeholder || '';
      if (f.autocomplete) inputEl.autocomplete = f.autocomplete;
      inputEl.enterKeyHint = idx === fields.length - 1 ? 'done' : 'next';
      inputEl.oninput = () => { values[f.id] = inputEl.value; };
      inputEl.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); go(1, true); } };
      return inputEl;
    }

    function show(i, focus) {
      idx = Math.max(0, Math.min(fields.length - 1, i));
      const f = fields[idx];
      if (!f) return;
      pane.textContent = '';
      pane.appendChild(el('label', '', asText(f.label || f.id, 80)));
      pane.appendChild(fieldControl(f));
      back.style.visibility = idx === 0 ? 'hidden' : 'visible';
      next.textContent = idx === fields.length - 1 ? 'Submit' : 'Next';
      paintProgress();
      if (focus) {
        const focusEl = pane.querySelector('input, select');
        if (focusEl) setTimeout(() => { try { focusEl.focus(); } catch { /* ignore */ } }, 50);
      }
    }

    function go(dir, focus) {
      const f = fields[idx];
      if (!f) return;
      if (dir > 0 && f.required && f.type !== 'toggle' && (values[f.id] === '' || values[f.id] == null)) {
        const focusEl = pane.querySelector('input, select');
        if (focusEl) { try { focusEl.focus(); } catch { /* ignore */ } }
        return;
      }
      if (dir > 0 && idx === fields.length - 1) {
        submitPoll(ev.id, values);
        return;
      }
      show(idx + dir, Boolean(focus) && dir > 0);
    }

    back.onclick = () => go(-1, false);
    next.onclick = () => go(1, true);
    let startX = 0;
    let startY = 0;
    wizard.addEventListener('touchstart', (e) => {
      const t = e.touches && e.touches[0];
      startX = t ? t.clientX : 0;
      startY = t ? t.clientY : 0;
    }, { passive: true });
    wizard.addEventListener('touchend', (e) => {
      const t = e.changedTouches && e.changedTouches[0];
      if (!t) return;
      const dx = t.clientX - startX;
      const dy = t.clientY - startY;
      if (Math.abs(dx) > 64 && Math.abs(dx) > Math.abs(dy) * 1.2) go(dx < 0 ? 1 : -1, false);
    }, { passive: true });
    show(0, isFresh(ev));
    chat.appendChild(card);
  }

  async function submitPoll(id, answers) {
    try {
      await api('/api/poll/' + encodeURIComponent(id), { method: 'POST', body: JSON.stringify({ answers }) });
    } catch { setNow('Couldn’t send that'); }
  }

  async function decide(id, approved, always) {
    try {
      await api('/api/approve', { method: 'POST', body: JSON.stringify({ id, approved, always }) });
    } catch { setNow('Couldn’t send that'); }
  }

  function renderAttachRow() {
    const row = document.getElementById('attachRow');
    if (!row) return;
    row.textContent = '';
    pendingFiles.forEach((f, i) => {
      const chip = el('div', 'attach-chip');
      chip.appendChild(el('span', '', f.name));
      const x = el('button', '', '×');
      x.type = 'button';
      x.onclick = () => { pendingFiles.splice(i, 1); renderAttachRow(); };
      chip.appendChild(x);
      row.appendChild(chip);
    });
  }

  function addFiles(list) {
    const incoming = Array.from(list || []);
    for (const file of incoming) {
      if (file.size > 8 * 1024 * 1024) {
        setNow(file.name + ' is over 8MB');
        continue;
      }
      pendingFiles.push(file);
    }
    renderAttachRow();
  }

  function readAsBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const s = String(reader.result || '');
        resolve(s.includes(',') ? s.split(',')[1] : s);
      };
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('filePick').addEventListener('change', (e) => {
    addFiles(e.target.files);
    e.target.value = '';
  });
  document.getElementById('folderPick').addEventListener('change', (e) => {
    addFiles(e.target.files);
    e.target.value = '';
  });
  document.getElementById('attachBtn').addEventListener('contextmenu', (e) => {
    e.preventDefault();
    document.getElementById('folderPick').click();
  });

  function appendUserBubble(text, names, hist, pending) {
    if (!chat) return;
    const bubble = el('div', 'msg user' + (hist || ''), text || '(attachment)');
    bubble.dataset.text = text || '(attachment)';
    if (pending) bubble.dataset.pending = '1';
    if (names && names.length) {
      const files = el('div', 'files');
      names.forEach((n) => files.appendChild(el('i', '', asText(n, 80))));
      bubble.appendChild(files);
    }
    chat.appendChild(bubble);
    scroll();
  }

  function showOutgoing(text, names) {
    localPending = { text: text || '(attachment)', names: names || [] };
    appendUserBubble(localPending.text, localPending.names, '', true);
    setPresence('thinking');
    setNow('Working');
  }

  function dropPendingBubble() {
    localPending = null;
    try {
      const nodes = chat ? chat.querySelectorAll('.msg.user[data-pending="1"]') : [];
      if (nodes.length) nodes[nodes.length - 1].remove();
    } catch { /* ignore */ }
  }

  function restorePending() {
    if (!localPending || !chat) return;
    let shown = false;
    try {
      const nodes = chat.querySelectorAll('.msg.user');
      const last = nodes[nodes.length - 1];
      shown = !!(last && last.dataset && last.dataset.text === localPending.text);
      if (shown && last.dataset.pending !== '1') localPending = null;
    } catch { shown = false; }
    if (!localPending) return;
    if (!shown) appendUserBubble(localPending.text, localPending.names, '', true);
    setPresence('thinking');
    const nowEl = document.getElementById('now');
    if (!nowEl || nowEl.hidden) setNow('Working');
  }

  function showChatError(text) {
    localPending = null;
    try {
      if (chat) chat.querySelectorAll('.msg.user[data-pending="1"]').forEach((n) => n.removeAttribute('data-pending'));
    } catch { /* ignore */ }
    const msg = asText(text || 'Something went wrong', 300);
    setNow('');
    try {
      if (chat) {
        chat.appendChild(el('div', 'msg error', msg));
        scroll();
      }
    } catch { setNow(msg); }
    try { setPresence('idle'); } catch { /* ignore */ }
    if (sendBtn) sendBtn.disabled = false;
  }

  function ensureStream() {
    if (!auth) return;
    if (es && es.readyState !== 2) return;
    try { connect(); } catch { /* postMessage reports a dead server */ }
  }

  async function postMessage(text, attachments, alreadyShown) {
    const clean = String(text || '').trim();
    const names = (attachments || []).map((a) => a && a.name).filter(Boolean);
    if (!clean && !names.length) return;
    if (!alreadyShown) showOutgoing(clean || '(attachment)', names);
    ensureStream();
    try {
      const r = await api('/api/message', {
        method: 'POST',
        body: JSON.stringify({ text: clean, attachments: attachments || [] }),
      });
      if (!r) { showChatError('Kyte isn’t running on this Mac'); return; }
      if (r.status === 401) { showLogin(); return; }
      if (r.status === 409) {
        dropPendingBubble();
        if (input && clean && !input.value.trim()) input.value = clean;
        setPresence('thinking');
        setNow('Still working');
        return;
      }
      if (!r.ok) {
        let msg = 'Couldn’t send';
        try {
          const data = await r.json();
          if (data && data.error) msg = String(data.error).slice(0, 240);
        } catch { /* keep the fallback */ }
        showChatError(msg);
      }
    } catch {
      showChatError('Kyte isn’t running on this Mac');
    }
  }

  function quick(kind) {
    const text = QUICK[kind];
    if (!text) return;
    postMessage(text);
  }

  async function send() {
    try {
      if (!input) return;
      const text = input.value.trim();
      if (!text && !pendingFiles.length) return;
      const files = pendingFiles.slice();
      pendingFiles = [];
      renderAttachRow();
      input.value = '';
      const names = files.map((f) => f.webkitRelativePath || f.name);
      showOutgoing(text || (names.length ? '(attachment)' : ''), names);
      const attachments = [];
      for (const file of files) {
        attachments.push({
          name: file.webkitRelativePath || file.name,
          mime: file.type || 'application/octet-stream',
          data: await readAsBase64(file),
        });
      }
      await postMessage(text, attachments, true);
    } catch {
      showChatError('Couldn’t read that file');
    }
  }

  function closeStream() {
    try {
      if (es) {
        es.onmessage = null;
        es.onerror = null;
        es.close();
      }
    } catch { /* ignore */ }
    es = null;
  }

  async function resetChat() {
    closeStream();
    let r = null;
    try {
      r = await api('/api/reset', { method: 'POST', body: '{}' });
    } catch {
      r = null;
    }
    if (sendBtn) sendBtn.disabled = false;
    if (!r) {
      showChatError('Kyte isn’t running on this Mac. Refresh in a moment.');
      return;
    }
    if (r.status === 401) {
      showLogin();
      return;
    }
    if (!r.ok) {
      showChatError('Couldn’t start a new chat');
      return;
    }
    try { if (chat) chat.textContent = ''; } catch { /* ignore */ }
    setNow('');
    try { setPresence('idle'); } catch { /* ignore */ }
    try { connect(); } catch {
      showChatError('Kyte isn’t running on this Mac. Refresh in a moment.');
    }
  }

  function cleanName(s) {
    const t = String(s || '').replace(/\s+/g, ' ').trim();
    if (!t || t.length > 48) return '';
    return t;
  }

  function loadPins() {
    try {
      const v = JSON.parse(localStorage.getItem('kyte_pins') || '[]');
      return Array.isArray(v) ? v.map(cleanName).filter(Boolean) : [];
    } catch { return []; }
  }

  function loadRecents() {
    try {
      const v = JSON.parse(localStorage.getItem('kyte_recents') || '[]');
      if (!Array.isArray(v)) return [];
      return v.map((r) => ({
        name: cleanName(r && r.name),
        via: r && r.via === 'text' ? 'text' : 'call',
      })).filter((r) => r.name);
    } catch { return []; }
  }

  function rememberPerson(name, via) {
    const n = cleanName(name);
    if (!n) return;
    const recents = loadRecents().filter((r) => r.name !== n);
    recents.unshift({ name: n, via: via === 'text' ? 'text' : 'call' });
    try { localStorage.setItem('kyte_recents', JSON.stringify(recents.slice(0, 8))); } catch { /* ignore */ }
    renderPeople();
  }

  function notePersonFromTool(ev) {
    try {
      const args = ev && ev.args && typeof ev.args === 'object' ? ev.args : {};
      if (ev.name === 'facetime_call' && args.to) rememberPerson(args.to, 'call');
      else if (ev.name === 'send_imessage' && args.to) rememberPerson(args.to, 'text');
      else if ((ev.name === 'find_contact' || ev.name === 'save_contact') && args.name) rememberPerson(args.name, 'call');
    } catch { /* ignore */ }
  }

  function togglePin(name) {
    const n = cleanName(name);
    if (!n) return;
    const cur = loadPins();
    const next = cur.includes(n) ? cur.filter((p) => p !== n) : [n, ...cur];
    try { localStorage.setItem('kyte_pins', JSON.stringify(next.slice(0, 8))); } catch { /* ignore */ }
    renderPeople();
  }

  function callPerson(name) {
    const n = cleanName(name);
    if (!n) return;
    const via = loadRecents().find((r) => r.name === n);
    postMessage((via && via.via === 'text' ? 'Text ' : 'Call ') + n);
  }

  function renderPeople() {
    const row = document.getElementById('people');
    if (!row) return;
    const pins = loadPins();
    const names = [];
    const add = (n) => {
      const c = cleanName(n);
      if (c && !names.includes(c)) names.push(c);
    };
    pins.forEach(add);
    loadRecents().forEach((r) => add(r.name));
    contactNames.forEach(add);
    row.textContent = '';
    if (!names.length) { row.hidden = true; return; }
    row.hidden = false;
    names.slice(0, 8).forEach((name) => {
      const pinned = pins.includes(name);
      const chip = el('div', 'person' + (pinned ? ' pinned' : ''));
      const who = el('button', 'who', name);
      who.type = 'button';
      who.setAttribute('aria-label', (loadRecents().find((r) => r.name === name && r.via === 'text') ? 'Text ' : 'Call ') + name);
      who.onclick = () => callPerson(name);
      const star = el('button', 'star', pinned ? '★' : '☆');
      star.type = 'button';
      star.setAttribute('aria-label', (pinned ? 'Unpin ' : 'Pin ') + name);
      star.onclick = (e) => { e.stopPropagation(); togglePin(name); };
      chip.append(who, star);
      row.appendChild(chip);
    });
  }

  async function loadPeople() {
    try {
      const r = await api('/api/contacts');
      if (r.status === 401) { showLogin(); return; }
      if (!r.ok) { renderPeople(); return; }
      const data = await r.json();
      contactNames = (data.contacts || []).map((c) => c && c.name).map(cleanName).filter(Boolean);
    } catch {
      contactNames = [];
    }
    renderPeople();
  }

  const PROFILE_KEYS = ['name', 'email', 'phone', 'address', 'city', 'state', 'zip', 'country'];
  let editingAcct = null;

  function vaultTab(which) {
    const profileTab = document.getElementById('tabProfile');
    const accountsTab = document.getElementById('tabAccounts');
    const profile = document.getElementById('vaultProfile');
    const accounts = document.getElementById('vaultAccounts');
    if (profileTab) profileTab.classList.toggle('on', which === 'profile');
    if (accountsTab) accountsTab.classList.toggle('on', which === 'accounts');
    if (profile) profile.classList.toggle('hidden', which !== 'profile');
    if (accounts) accounts.classList.toggle('hidden', which !== 'accounts');
  }

  function vaultToast(msg) {
    const t = document.getElementById('vaultToast');
    if (t) t.textContent = msg || '';
  }

  async function toggleVault(force) {
    const sheet = document.getElementById('vaultSheet');
    const btn = document.getElementById('vaultBtn');
    if (!sheet) return;
    const open = force === false ? false : force === true ? true : !sheet.classList.contains('open');
    sheet.classList.toggle('open', open);
    if (btn) btn.classList.toggle('on', open);
    if (open) {
      vaultToast('');
      vaultTab('profile');
      await loadVaultUI();
    }
  }

  async function loadVaultUI() {
    let data;
    try {
      const r = await api('/api/vault');
      if (!r.ok) return;
      data = await r.json();
    } catch { return; }
    const p = data.profile || {};
    PROFILE_KEYS.forEach((k) => {
      const field = document.getElementById('vp_' + k);
      if (field) field.value = p[k] || '';
    });
    const list = document.getElementById('acctList');
    if (!list) return;
    list.textContent = '';
    const accounts = data.accounts || [];
    accounts.forEach((a) => {
      const row = el('div', 'acct');
      const top = el('div', 'top');
      top.appendChild(el('b', '', a.site || 'Account'));
      const edit = el('button', 'tiny', 'Edit');
      const del = el('button', 'tiny danger', 'Delete');
      edit.type = del.type = 'button';
      edit.onclick = () => {
        editingAcct = a.id;
        const site = document.getElementById('va_site');
        const user = document.getElementById('va_user');
        const secret = document.getElementById('va_secret');
        if (site) site.value = a.site || '';
        if (user) user.value = a.username || '';
        if (secret) {
          secret.value = '';
          secret.placeholder = a.has_secret ? 'Leave blank to keep' : 'Password';
        }
        vaultToast('Editing ' + (a.site || 'account'));
      };
      del.onclick = async () => {
        try { await api('/api/vault/account/' + encodeURIComponent(a.id), { method: 'DELETE' }); } catch { /* ignore */ }
        await loadVaultUI();
      };
      top.append(edit, del);
      row.appendChild(top);
      row.appendChild(el('div', 'who', a.username || 'No username'));
      row.appendChild(el('div', 'mask', a.has_secret ? '••••••••' : 'No password saved'));
      list.appendChild(row);
    });
    if (!accounts.length) {
      list.appendChild(el('div', 'sub', 'No accounts yet. Add a site below — the password stays on this Mac.'));
    }
  }

  async function saveProfile() {
    const profile = {};
    PROFILE_KEYS.forEach((k) => {
      const field = document.getElementById('vp_' + k);
      if (field) profile[k] = field.value.trim();
    });
    try {
      await api('/api/vault/profile', { method: 'POST', body: JSON.stringify({ profile }) });
      vaultToast('Profile saved');
    } catch { vaultToast('Couldn’t save'); }
  }

  async function saveAccount() {
    const siteEl = document.getElementById('va_site');
    const userEl = document.getElementById('va_user');
    const secretEl = document.getElementById('va_secret');
    const site = siteEl ? siteEl.value.trim() : '';
    const username = userEl ? userEl.value.trim() : '';
    const secret = secretEl ? secretEl.value : '';
    if (!site && !username) return;
    try {
      await api('/api/vault/account', {
        method: 'POST',
        body: JSON.stringify({ id: editingAcct || undefined, site, username, secret }),
      });
    } catch { vaultToast('Couldn’t save'); return; }
    editingAcct = null;
    if (siteEl) siteEl.value = '';
    if (userEl) userEl.value = '';
    if (secretEl) { secretEl.value = ''; secretEl.placeholder = 'Stored on this Mac'; }
    vaultToast('Saved on this Mac');
    await loadVaultUI();
  }

  function toggleLive() {
    const panel = document.getElementById('live');
    const btn = document.getElementById('liveBtn');
    if (!panel) return;
    const on = !panel.classList.contains('open');
    panel.classList.toggle('open', on);
    if (btn) btn.classList.toggle('on', on);
    if (on) { refreshLive(); liveTimer = setInterval(refreshLive, 1200); }
    else { clearInterval(liveTimer); liveTimer = null; }
  }

  async function refreshLive() {
    const img = document.getElementById('liveImg');
    const err = document.getElementById('liveErr');
    if (!img || !err) return;
    try {
      const r = await api('/api/screen');
      if (!r.ok) {
        const data = await r.json().catch(() => ({}));
        err.textContent = data.error || 'Screen capture unavailable.';
        err.style.display = 'block';
        return;
      }
      err.style.display = 'none';
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const old = img.src;
      img.src = url;
      if (old && old.indexOf('blob:') === 0) URL.revokeObjectURL(old);
    } catch { /* next tick retries */ }
  }

  function connect() {
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    closeStream();
    try { if (chat) chat.textContent = ''; } catch { /* ignore */ }
    replaying = true;
    try {
      es = new EventSource('/api/events?auth=' + encodeURIComponent(auth));
    } catch {
      restorePending();
      showChatError('Kyte isn’t running on this Mac');
      return;
    }
    es.onmessage = (m) => {
      let ev;
      try { ev = JSON.parse(m.data); } catch { return; }
      render(ev);
    };
    es.onerror = () => {
      try {
        if (!es || es.readyState !== 2 || reconnectTimer) return;
        reconnectTimer = setTimeout(async () => {
          reconnectTimer = null;
          let probe = null;
          try { probe = await api('/api/contacts'); } catch { probe = null; }
          if (probe && probe.status === 401) { showLogin(); return; }
          if (auth) connect();
        }, 800);
      } catch { /* ignore */ }
    };
    setTimeout(() => {
      replaying = false;
      try { restorePending(); } catch { /* ignore */ }
      try { scroll(); } catch { /* ignore */ }
    }, 80);
    try { loadPeople(); } catch { /* ignore */ }
    try { renderPeople(); } catch { /* ignore */ }
  }

  if (input) input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
  renderPeople();

  if (!auth) showLogin();
  else connect();
</script>
</body>
</html>
