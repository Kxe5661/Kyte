<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b1020" />
<title>Kyte</title>
<style>
  :root {
    --bg: #0b1020; --panel: #141a2f; --panel-2: #1b2240;
    --text: #e8ecf8; --muted: #8b93b0; --accent: #4da3ff;
    --ok: #37c978; --danger: #ff5d6c; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
    background: var(--panel); border-bottom: 1px solid #232b4d;
    position: sticky; top: 0; z-index: 5;
  }
  header .logo { font-weight: 700; font-size: 18px; letter-spacing: .5px; }
  header .logo span { color: var(--accent); }
  #status { font-size: 12px; color: var(--muted); margin-left: auto; }
  #status.thinking { color: var(--accent); }
  #reset { background: none; border: 1px solid #2a3360; color: var(--muted);
    border-radius: 8px; padding: 4px 10px; font-size: 12px; }

  #chat { flex: 1; overflow-y: auto; padding: 14px 12px 8px; -webkit-overflow-scrolling: touch; }
  .msg { max-width: 86%; margin: 6px 0; padding: 10px 14px; border-radius: var(--radius);
    white-space: pre-wrap; word-break: break-word; }
  .user { background: var(--accent); color: #06101f; margin-left: auto; border-bottom-right-radius: 4px; }
  .assistant { background: var(--panel-2); border-bottom-left-radius: 4px; }
  .error { background: #3a1522; color: #ffb3bc; font-size: 14px; }
  .tool { color: var(--muted); font-size: 12.5px; padding: 4px 14px; max-width: 100%;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tool .name { color: var(--accent); }
  .tool pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-all;
    max-height: 90px; overflow: hidden; opacity: .8; }

  .approval { background: var(--panel-2); border: 1px solid #2a3360; border-radius: var(--radius);
    padding: 12px 14px; margin: 8px 0; max-width: 100%; }
  .approval h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .approval pre { background: #0d1326; border-radius: 8px; padding: 10px; margin: 0 0 10px;
    font-size: 13px; white-space: pre-wrap; word-break: break-all; max-height: 160px; overflow-y: auto; }
  .approval .btns { display: flex; gap: 10px; }
  .approval button { flex: 1; padding: 10px; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; }
  .approve { background: var(--ok); color: #06101f; }
  .deny { background: #2a3360; color: var(--text); }
  .approval.resolved .btns { display: none; }
  .approval .verdict { font-size: 13px; font-weight: 600; }
  .verdict.yes { color: var(--ok); } .verdict.no { color: var(--danger); }

  footer {
    display: flex; gap: 8px; padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px);
    background: var(--panel); border-top: 1px solid #232b4d;
  }
  #input { flex: 1; background: #0d1326; border: 1px solid #2a3360; color: var(--text);
    border-radius: 22px; padding: 11px 16px; font-size: 16px; outline: none; }
  #send { background: var(--accent); color: #06101f; border: none; border-radius: 50%;
    width: 44px; height: 44px; font-size: 18px; font-weight: 700; flex-shrink: 0; }
  #send:disabled { opacity: .5; }

  #login { position: fixed; inset: 0; background: var(--bg); z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; }
  #login h1 { font-size: 28px; margin: 0; } #login h1 span { color: var(--accent); }
  #login p { color: var(--muted); margin: 0; text-align: center; font-size: 14px; }
  #password { background: #0d1326; border: 1px solid #2a3360; color: var(--text);
    border-radius: 12px; padding: 12px 16px; font-size: 18px; text-align: center; width: 220px; }
  #login button { background: var(--accent); color: #06101f; border: none; border-radius: 12px;
    padding: 12px 32px; font-size: 16px; font-weight: 700; }
  #loginErr { color: var(--danger); font-size: 14px; min-height: 18px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="login" class="hidden">
    <h1>K<span>y</span>te</h1>
    <p>Enter the password shown in the Kyte<br/>terminal on your Mac.</p>
    <input id="password" type="password" placeholder="password" autocomplete="current-password" />
    <button onclick="tryLogin()">Connect</button>
    <div id="loginErr"></div>
  </div>

  <header>
    <div class="logo">K<span>y</span>te</div>
    <div id="status">idle</div>
    <button id="reset" onclick="resetChat()">New chat</button>
  </header>

  <div id="chat"></div>

  <footer>
    <input id="input" placeholder="Tell Kyte what to do…" autocomplete="off" />
    <button id="send" onclick="send()">↑</button>
  </footer>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const statusEl = document.getElementById('status');
  let auth = localStorage.getItem('kyte_auth') || '';
  let es = null;

  function api(path, opts = {}) {
    return fetch(path, {
      ...opts,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + auth, ...(opts.headers || {}) },
    });
  }

  async function tryLogin() {
    auth = document.getElementById('password').value.trim();
    const r = await fetch('/api/events?auth=' + encodeURIComponent(auth), { method: 'HEAD' }).catch(() => null);
    // HEAD on SSE isn't reliable everywhere; just probe with a harmless authorized call
    const probe = await api('/api/approve', { method: 'POST', body: '{}' });
    if (probe.status === 401) {
      document.getElementById('loginErr').textContent = 'Wrong password';
      return;
    }
    localStorage.setItem('kyte_auth', auth);
    document.getElementById('login').classList.add('hidden');
    connect();
  }

  function showLogin() {
    document.getElementById('login').classList.remove('hidden');
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function scroll() { chat.scrollTop = chat.scrollHeight; }

  function fmtArgs(args) {
    if (!args) return '';
    if (args.command) return args.command;
    if (args.script) return args.script;
    return JSON.stringify(args, null, 2);
  }

  function render(ev) {
    if (ev.type === 'user') chat.appendChild(el('div', 'msg user', ev.text));
    else if (ev.type === 'assistant') chat.appendChild(el('div', 'msg assistant', ev.text));
    else if (ev.type === 'error') chat.appendChild(el('div', 'msg error', ev.text));
    else if (ev.type === 'status') {
      statusEl.textContent = ev.state === 'thinking' ? 'thinking…' : 'idle';
      statusEl.className = ev.state === 'thinking' ? 'thinking' : '';
      if (ev.note) chat.appendChild(el('div', 'tool', ev.note));
      sendBtn.disabled = ev.state === 'thinking';
    }
    else if (ev.type === 'tool_start') {
      const d = el('div', 'tool');
      const label = el('div');
      label.innerHTML = '⚙︎ <span class="name"></span>';
      label.querySelector('.name').textContent = ev.name;
      d.appendChild(label);
      const pre = el('pre', '', fmtArgs(ev.args));
      d.appendChild(pre);
      chat.appendChild(d);
    }
    else if (ev.type === 'approval_request') {
      const card = el('div', 'approval');
      card.dataset.id = ev.id;
      card.appendChild(el('h4', '', 'Kyte wants to run: ' + ev.name));
      card.appendChild(el('pre', '', fmtArgs(ev.args)));
      const btns = el('div', 'btns');
      const ok = el('button', 'approve', 'Approve');
      const no = el('button', 'deny', 'Deny');
      ok.onclick = () => decide(ev.id, true);
      no.onclick = () => decide(ev.id, false);
      btns.appendChild(no); btns.appendChild(ok);
      card.appendChild(btns);
      card.appendChild(el('div', 'verdict'));
      chat.appendChild(card);
    }
    else if (ev.type === 'approval_resolved') {
      const card = chat.querySelector('.approval[data-id="' + ev.id + '"]');
      if (card) {
        card.classList.add('resolved');
        const v = card.querySelector('.verdict');
        v.textContent = ev.approved ? '✓ Approved' : '✕ Denied' + (ev.reason === 'timeout' ? ' (timed out)' : '');
        v.classList.add(ev.approved ? 'yes' : 'no');
      }
    }
    scroll();
  }

  async function decide(id, approved) {
    await api('/api/approve', { method: 'POST', body: JSON.stringify({ id, approved }) });
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    const r = await api('/api/message', { method: 'POST', body: JSON.stringify({ text }) });
    if (r.status === 401) { showLogin(); return; }
    if (r.status === 409) alert('Kyte is still working — wait for it to finish.');
  }

  async function resetChat() {
    await api('/api/reset', { method: 'POST' });
    chat.innerHTML = '';
  }

  function connect() {
    if (es) es.close();
    chat.innerHTML = '';
    es = new EventSource('/api/events?auth=' + encodeURIComponent(auth));
    es.onmessage = (m) => render(JSON.parse(m.data));
    es.onerror = () => {
      // If auth failed the stream closes immediately; show login.
      if (es.readyState === EventSource.CLOSED) showLogin();
    };
  }

  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

  if (!auth) showLogin();
  else connect();
</script>
</body>
</html>
